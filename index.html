<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 추천 사이트</title>
    <link rel="stylesheet" as="style" crossorigin 
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        * {
            font-family: "Pretendard Variable", Pretendard, -apple-system,
            BlinkMacSystemFont, system-ui, Roboto, "Droid Sans", "Helvetica Neue", 
            "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", 
            "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
        }

        #main-page {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h5 {
            font-size: 1.5rem;
            margin-bottom: 40px;
        }
        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin: 0 auto;
        }

        button {
            background-color: white;
            color: black;
            border: none;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: badkground-color 0.2s, transform 0.2s;
        }

        .recommend-header {
            text-align: left; 
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        #recommend-title {
            font-size: 1.8rem;
            color: #ffff00; 
            margin: 0 0 10px 0;
        }

        .title-line {
            border: 0;
            height: 2px;
            background-color: #ffffff;
            margin: 0 0 10px 0;
            width: 100%;
        }

        .recommend-sub {
            color: #aaaaaa;
            margin: 0;
        }

        .poster-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .poster-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 10px;
            overflow: hidden;
            background-color: #1a1a1a;
            cursor: pointer;
        }

        .flip-front {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; 
            left: 0;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .poster-card.active .flip-front {
            opacity: 0; 
            visibility: hidden;
        }

        .info-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #ffff00;
            color: #000000;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: background-color 0.2s;
            
            position: relative;
            z-index: 10;
        }
        .info-btn:hover {
        background-color: #cccc00; /* 마우스 올리면 살짝 어두워지는 효과 */
        }

        .back2home-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: white;
            color: black;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="main-page">
        <h1>당신을 위한 영화를 추천해드립니다.</h1>
        <h5>아래의 키워드를 클릭해보세요.</h5>
        <div class="button-container">
            <button type="button" onclick="showMovies('comedy')">#아무 생각 없이 깔깔 웃고 싶을 때</button>
            <button type="button" onclick="showMovies('sad')">#서서히 밀려오는 슬픔을 느끼고 싶을 때</button>
            <button type="button" onclick="showMovies('healing')">#잔잔한 힐링이 필요할 때</button>
            <button type="button" onclick="showMovies('fantasy')">#현실도피! 상상 속으로 떠나고 싶을 때</button>
            <button type="button" onclick="showMovies('romance')">#남의 사랑 얘기를 엿보고 싶을 때</button>
            <button type="button" onclick="showMovies('music')">#음악과 함께 영화를 즐기고 싶을 때</button>
        </div>
    </div>

    <div id="recommend-page" style="display: none;">
        <div class="recommend-header">
            <h2 id="recommend-title">추천 영화</h2>
            <hr class="title-line"> 
            <p class="recommend-sub">포스터를 클릭하면 영화의 세부 정보를 확인할 수 있어요.</p>
        </div>

        <div class="poster-container">
            <div class="poster-card">
                <img id="poster1" class="flip-front" src="" alt="영화1" onclick="flipCard(this.parentElement)">
                
                <div class="flip-back">
                    <h3 id="title1">영화 제목 1</h3>
                    <a id="link1" href="#" target="_blank" class="info-btn" onclick="event.stopPropagation();">상세 정보 보러가기</a>
                </div>
            </div>

            <div class="poster-card">
                <img id="poster2" class="flip-front" src="" alt="영화2" onclick="flipCard(this.parentElement)">
                
                <div class="flip-back">
                    <h3 id="title2">영화 제목 2</h3>
                    <a id="link2" href="#" target="_blank" class="info-btn" onclick="event.stopPropagation();">상세 정보 보러가기</a>
                </div>
            </div>

            <div class="poster-card">
                <img id="poster3" class="flip-front" src="" alt="영화3" onclick="flipCard(this.parentElement)">
                <div class="flip-back">
                    <h3 id="title3">영화 제목 3</h3>
                    <a id="link3" href="#" target="_blank" class="info-btn" onclick="event.stopPropagation();">상세 정보 보러가기</a>
                </div>
            </div>
        </div>

        <button type="button" class="back2home-btn" onclick="goHome()">홈으로 돌아가기</button>
    </div>

    <script>
        const movieData = {
            comedy: {
                title: "아무 생각 없이 깔깔 웃고 싶은 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/00/04/60/DPF014338_01.jpg", // 나를 차버린 스파이
                    "https://file.koreafilm.or.kr/poster/99/19/01/DPK024064_01.jpg", // 하이파이브
                    "https://file.koreafilm.or.kr/poster/00/04/82/DPK014092_01.jpg" // 극한직업
                ],
                names: ["나를 차버린 스파이", "하이파이브", "극한직업"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/mObGV9n",
                    "https://pedia.watcha.com/ko/contents/mWw3Goq",
                    "https://pedia.watcha.com/ko/contents/mdMBlkR"
                ] // 왓챠피디아 사이트로 이동 (영화 정보 사이트)
            },
            sad: {
                title: "서서히 밀려오는 슬픔을 느끼고 싶은 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/99/17/93/DPF026655_01.jpg", // 애프터썬
                    "https://file.koreafilm.or.kr/poster/00/03/42/DPF05631A_01.jpg", // 인생은 아름다워
                    "https://file.koreafilm.or.kr/poster/00/04/84/DPF015461_01.jpg" // 가버나움
                ],
                names: ["애프터썬", "인생은 아름다워", "가버나움"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/mWw3EXX",
                    "https://pedia.watcha.com/ko/contents/mV539wO",
                    "https://pedia.watcha.com/ko/contents/m5DGP37"
                ]
            },
            healing: {
                title: "잔잔한 힐링이 필요한 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/00/04/66/DPK013422_01.jpg", // 리틀 포레스트
                    "https://image.tmdb.org/t/p/w1280/88J7DQ0Yn6MIqXaAiTgjyErzPnh.jpg", // 월터의 상상은 현실이 된다
                    "https://file.koreafilm.or.kr/poster/99/17/56/DPF024693_01.jpg" // 카모메 식당
                ],
                names: ["리틀 포레스트", "월터의 상상은 현실이 된다", "카모메 식당"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/m5NVpDp",
                    "https://pedia.watcha.com/ko/contents/mW4vBed",
                    "https://pedia.watcha.com/ko/contents/mJOVpN5"
                ]
            },
            fantasy: {
                title: "현실도피! 상상 속으로 떠나고 싶은 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/00/03/86/DPF02219B_01.jpg", // 빽 투 더 퓨쳐
                    "https://file.koreafilm.or.kr/poster/00/02/64/DPF006474_01.JPG", // 나니아 연대기
                    "https://file.koreafilm.or.kr/poster/00/02/94/DPF008206_01.JPG" // 해리포터
                ],
                names: ["빽 투 더 퓨쳐", "나니아 연대기", "해리포터"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/mWLjx6d",
                    "https://pedia.watcha.com/ko/contents/mOVv9NO",
                    "https://pedia.watcha.com/ko/contents/mmOb3kd"
                ]
            },
            romance: {
                title: "남의 사랑 얘기를 엿보고 싶은 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/99/18/68/DPF030452_01.jpg", // 이터널 선샤인
                    "https://file.koreafilm.or.kr/poster/00/01/58/DPK004941_01.JPG", // 시월애
                    "https://file.koreafilm.or.kr/poster/00/02/92/DPF008132_01.JPG" // 냉정과 열정사이
                ],
                names: ["이터널 선샤인", "시월애", "냉정과 열정사이"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/m85X9LW",
                    "https://pedia.watcha.com/ko/contents/mpWpQMO",
                    "https://pedia.watcha.com/ko/contents/m5Y6YwW"
                ]
            },
            music: {
                title: "음악과 함께 영화를 즐기고 싶은 당신을 위한 영화",
                posters: [
                    "https://file.koreafilm.or.kr/poster/99/19/37/DPF033080_01.jpg", // 싱 스트리트
                    "https://file.koreafilm.or.kr/poster/99/17/46/DPF024258_01.jpg", // 틱틱붐
                    "https://file.koreafilm.or.kr/poster/00/02/90/DPF007914_01.JPG" // 비긴 어게인
                ],
                names: ["싱 스트리트", "틱, 틱...붐!", "비긴 어게인"],
                urls: [
                    "https://pedia.watcha.com/ko/contents/mO8KzlX",
                    "https://pedia.watcha.com/ko/contents/mOVPM78",
                    "https://pedia.watcha.com/ko/contents/mOPpNlO"
                ]
            }
        }
    
        function showMovies(genre) {
            const selectedGenre = movieData[genre];

            if (selectedGenre) {
                document.getElementById('recommend-title').innerText = selectedGenre.title;

                const cards = document.querySelectorAll('.poster-card');

            // 3개의 카드 데이터 매칭 및 초기화
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`poster${i}`).src = selectedGenre.posters[i-1];
                document.getElementById(`title${i}`).innerText = selectedGenre.names[i-1];
                document.getElementById(`link${i}`).href = selectedGenre.urls[i-1];
            
                // 핵심: 다른 장르로 넘어갈 때 기존에 뒤집혀있던(active) 카드들을 전부 앞면으로 원상복구
                if(cards[i-1]) {
                    cards[i-1].classList.remove('active');
                }
            }

            // 화면 교체
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('recommend-page').style.display = 'block';
            }
        }
        
        // 카드를 클릭하면 실행되는 함수
        function flipCard(card) {
            card.classList.toggle('active');
        }
        function goHome() {
            document.getElementById('recommend-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'block';
        }
    </script>
</body>
</html>
